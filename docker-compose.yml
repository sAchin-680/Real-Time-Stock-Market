# Local stack: app + MongoDB + Inngest dev server (cron jobs, event functions).
#   cp .env.example .env   # fill in FINNHUB_API_KEY at minimum
#   docker compose up --build
services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/tickline
      BETTER_AUTH_URL: http://localhost:3000
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: http://inngest:8288
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://app:3000/api/inngest
    ports:
      - "8288:8288"
    depends_on:
      - app

volumes:
  mongo-data:
