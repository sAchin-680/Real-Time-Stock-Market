name: Deploy to Vercel with GitHub Actions

on:
    push:
        branches:
            - main # Trigger when changes are pushed to the main branch
    pull_request:
        branches:
            - main # Trigger for pull requests targeting the main branch

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Install Dependencies
              run: npm install

            - name: Run Linter
              run: npm run lint # Replace with your linter command

            - name: Notify Vercel about Lint Check
              uses: vercel/repository-dispatch/actions/status@v1
              with:
                  name: "Vercel - real-time-stock-market: lint" # Name of the check in Vercel UI
                  status: ${{ job.status }} # This resolves to "success" or "failure"
                  context: "lint" # Context for the check

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Install Dependencies
              run: npm install

            - name: Run Tests
              run: npm test # Replace with your testing command

            - name: Notify Vercel about Test Check
              uses: vercel/repository-dispatch/actions/status@v1
              with:
                  name: "Vercel - real-time-stock-market: test"
                  status: ${{ job.status }}
                  context: "test"

    deploy:
        needs: [lint, test] # Make sure lint and test jobs pass before deploying
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Install Dependencies
              run: npm install

            - name: Install Vercel CLI
              run: npm install -g vercel # Install the Vercel CLI

            - name: Deploy to Vercel
              run: vercel --prod --token ${{ secrets.VERCEL_TOKEN }} # Deploy with the Vercel token

            - name: Notify Vercel about Deployment Status
              uses: vercel/repository-dispatch/actions/status@v1
              with:
                  name: "Vercel - real-time-stock-market: deploy" # Name of the check
                  status: ${{ job.status }} # Passes the job status (success or failure)
                  context: "deploy" # Context for the deployment check
